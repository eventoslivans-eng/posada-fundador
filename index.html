<script>
/* Primer pintado con los colores guardados en la última visita (evita el destello) */
try{var b=JSON.parse(localStorage.getItem("pfBoot")||"null");if(b&&b.ink){var s=document.documentElement.style;
["ink","panel","line","gold","gold2","cream","mute"].forEach(function(k){if(b[k])s.setProperty("--"+k,b[k])});
if(b.rgb){s.setProperty("--ink-rgb",b.rgb[0]);s.setProperty("--gold-rgb",b.rgb[1]);s.setProperty("--gold2-rgb",b.rgb[2]);s.setProperty("--cream-rgb",b.rgb[3])}
document.documentElement.setAttribute("data-mode",b.mode==="light"?"light":"dark");s.setProperty("color-scheme",b.mode==="light"?"light":"dark")}}catch(e){}
</script>
<noscript><style>#loader{display:none}</style></noscript>
</head>
<body>
<div id="loader" role="status" aria-label="Cargando"><div class="ld"><div class="ring"></div><div class="pf">PF</div></div><div class="ln">Posada del Fundador</div><div class="lt">Tu experiencia, nuestra historia</div></div>
<script>
(function(){
  var l=document.getElementById("loader"),de=document.documentElement,t0=Date.now(),done=false,loaded=document.readyState==="complete",ready=false;
  if(/[?&]pfpreview/.test(location.search)){l.remove();return}
  try{var b=JSON.parse(localStorage.getItem("pfBoot")||"null");if(b&&b.loader){
    if(b.loader.enabled===false){l.remove();return}
    if(b.loader.monogram)l.querySelector(".pf").textContent=b.loader.monogram;
    if(b.loader.name)l.querySelector(".ln").textContent=b.loader.name;
    if(b.loader.tagline)l.querySelector(".lt").textContent=b.loader.tagline}}catch(e){}
  de.classList.add("loading");
  function hide(){if(done)return;done=true;setTimeout(function(){l.classList.add("done");de.classList.remove("loading");setTimeout(function(){l.remove()},900)},Math.max(0,1800-(Date.now()-t0)))}
  function check(){if(loaded&&ready)hide()}
  window.__pfReady=function(){ready=true;check()};
  if(!loaded)addEventListener("load",function(){loaded=true;check()});
  setTimeout(hide,6000);
})();
</script>
<div id="app"></div>
<script src="site.js"></script>
</body>
